<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Караоке-фортуна</title>
  <script async src="telegram-web-app.js?v=1113160050"></script>
  <link rel="stylesheet" href="style.css?v=1113160050">
</head>
<body>
  <main id="wheel-screen" class="screen active">
    <canvas id="lines" aria-hidden="true"></canvas>
    <div class="wheel-content">
      <h1>Караоке-<br>фортуна</h1>

      <div class="reel" id="reel">
        <div class="reel-strip" id="strip"></div>
        <div class="reel-arrow left"></div>
        <div class="reel-arrow right"></div>
      </div>

      <div id="result" class="result">
        <div class="result-label">Выпало</div>
        <div id="result-title" class="result-title"></div>
        <div id="result-artist" class="result-artist"></div>
      </div>
    </div>

    <div class="actions">
      <button id="spin" type="button">Вращать</button>
      <button id="sing" type="button" aria-label="Петь">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.500 3.500 0 0 0 3.500-3.500v-5a3.500 3.500 0 0 0-7 0v5A3.500 3.500 0 0 0 12 15z"/><path d="M18.500 11.500a.9.9 0 0 0-1.800 0 4.700 4.700 0 0 1-9.400 0 .9.9 0 0 0-1.800 0 6.500 6.500 0 0 0 5.600 6.430V20H9a.9.9 0 0 0 0 1.800h6a.9.9 0 0 0 0-1.800h-2.100v-2.070a6.500 6.500 0 0 0 5.600-6.430z"/></svg>
      </button>
    </div>
  </main>

  <main id="karaoke-screen" class="screen">
    <header class="k-head">
      <div id="k-cover" class="k-cover"></div>
      <div class="now">
        <div id="k-title" class="k-title"></div>
        <div id="k-artist" class="k-artist"></div>
      </div>
      <button id="exit" type="button" aria-label="К выбору песни">✕</button>
    </header>

    <div id="lyrics"><div id="lyrics-inner"></div></div>

    <div id="countdown" class="countdown">
      <div class="countdown-label">Приготовься</div>
      <div id="countdown-num" class="countdown-num">5</div>
    </div>

    <button id="tapstart" type="button">
      <span class="tapstart-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.500v15a1 1 0 0 0 1.500.860l12.500-7.500a1 1 0 0 0 0-1.720L8.500 3.640A1 1 0 0 0 7 4.500z"/></svg></span>
      <span class="tapstart-label">Нажми, чтобы начать</span>
    </button>

    <footer class="k-foot">
      <div class="bar"><div id="bar-fill"></div></div>
      <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
      <button id="toggle" type="button" aria-label="Пауза">
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.500 3.640A1 1 0 0 0 7 4.500z"/></svg>
      </button>
    </footer>
  </main>

  <audio id="audio" preload="auto" playsinline></audio>
  <script src="data.js?v=1113160050"></script>
  <script src="app.js?v=1113160050"></script>
</body>
</html>
